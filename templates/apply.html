<!DOCTYPE html>
<html>

<head>
    <title>Job Application</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <h1>Job Application</h1>

    <form method="POST">

        <label>Candidate Name</label>

        <input
            type="text"
            name="candidate_name"
            required
        >

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            required
        >

        <button type="submit">
            Submit Application
        </button>

    </form>

</div>

</body>
</html>
